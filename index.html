<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Carta de bienvenida</title>
  <link rel="stylesheet" href="estilos.css">
  <script src="tarjeta.js" defer></script>
</head>
<body>
  <main class="carta">
    <header class="encabezado">
      <img class="logo" id="logo" alt="Logo de NexoraTech">
      <h1 id="empresa"></h1>
    </header>

    <section class="contenido">
      <p id="departamento"></p>
      <h2>¡Te damos la bienvenida!</h2>
      <p id="empleado"></p>
      <p id="mensaje"></p>

      <div class="firma">
        <p>Atentamente,</p>
        <p class="nombre-firma" id="firma"></p>
        <p id="remitente"></p>
        <p id="cargo"></p>
      </div>
    </section>

    <footer id="pie"></footer>
  </main>
</body>
</html>
